[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parsing-ai-connector"
version = "0.1.0"
description = "Portal parsing, AI recommendations and RAG for AIJobResearcher"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14",
    "celery>=5.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "litellm>=1.55",
    "playwright>=1.49,<1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "N", "RUF", "SIM", "UP"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ANN", "INP001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
